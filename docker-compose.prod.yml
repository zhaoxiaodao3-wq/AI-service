# 生产编排（宝塔 VPS 使用）
#
# 用法（在服务器上，与 .env.prod 同目录）：
#   docker compose -f docker-compose.prod.yml up -d
#
# 两种镜像来源，二选一：
#   1. 本地构建：去掉下面 backend/frontend 的 image 行，保留 build 段
#   2. GHCR 拉取：保留 image 行（ghcr.io/你的GitHub账号/...），可删 build 段
#
# HTTPS 不在本文件处理：由宝塔创建网站 + SSL 证书 + 反向代理到本机 80 端口。

services:
  postgres:
    image: postgres:16
    container_name: aigc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 生产不对外暴露端口：只允许容器网络访问，防止数据库被公网直连
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aigc-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aigc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # image: ghcr.io/你的GitHub账号/aigc-backend:latest   # GHCR 拉取方式
    build:
      context: ./backend
    container_name: aigc-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    # image: ghcr.io/你的GitHub账号/aigc-backend:latest   # 与 backend 同一镜像，仅命令不同
    build:
      context: ./backend
    container_name: aigc-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "scripts.worker"]
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    # image: ghcr.io/你的GitHub账号/aigc-frontend:latest   # GHCR 拉取方式
    build:
      context: ./frontend
    container_name: aigc-frontend
    restart: unless-stopped
    # 生产只暴露 80：宝塔建网站反代到 localhost:80 并套 HTTPS
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  uploads_data:
