services:
  loki:
    image: grafana/loki:3.5.0
    container_name: aigc-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # 阶段 12：Trace 后端（OpenTelemetry OTLP 接收 + 查询）
  tempo:
    image: grafana/tempo:2.6.1
    container_name: aigc-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo 查询/UI（Grafana 数据源用）
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP（backend 默认上报地址）
    volumes:
      - tempo_data:/var/tempo
      - ./observability/tempo/config.yml:/etc/tempo.yaml

  promtail:
    image: grafana/promtail:3.5.0
    container_name: aigc-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/config.yml:/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aigc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - tempo

volumes:
  loki_data:
  tempo_data:
  grafana_data:
