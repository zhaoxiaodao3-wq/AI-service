# CI 流水线：测试 → 构建 → 推送 GHCR 镜像
#
# 触发：
#   - push 到 main/master：跑全部 Job（含推镜像）
#   - pull_request：只跑测试与构建，不推镜像
#
# GHCR 推送使用 GitHub 自动注入的 GITHUB_TOKEN（packages: write），
# 无需手动配置任何 Secrets。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ========== Job 1：后端测试 ==========
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  # ========== Job 2：前端构建 ==========
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (type-check + vite)
        run: pnpm build

  # ========== Job 3：构建并推送 GHCR 镜像（仅 push 到主分支）==========
  docker-push:
    name: Build & Push Images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigc-backend:latest
            ghcr.io/${{ github.repository_owner }}/aigc-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigc-frontend:latest
            ghcr.io/${{ github.repository_owner }}/aigc-frontend:${{ github.sha }}
